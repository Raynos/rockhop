<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>ROCKHOP • Handcrafted tabletop map</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1516;color:#f7efd9;font-family:Arial,sans-serif}canvas{display:block}#app{width:100%;height:100%}
    .hud{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(8,21,23,.78),transparent 26%,transparent 72%,rgba(8,21,23,.3))}.art-mode .hud{display:none}
    .brand{position:absolute;left:3.2%;top:4.6%;font-weight:1000;font-size:clamp(24px,3.2vw,50px);letter-spacing:-.07em;line-height:.88;text-shadow:0 3px 12px #102022}.brand small{display:block;font-size:clamp(9px,.95vw,15px);font-weight:800;letter-spacing:.3em;color:#eacfa1;margin-top:11px}
    .title{position:absolute;left:3.2%;bottom:5.2%;max-width:400px}.title .eyebrow{color:#f19e57;letter-spacing:.27em;font-size:11px;font-weight:900}.title h1{font-size:clamp(23px,2.8vw,44px);line-height:1;margin:8px 0 7px;text-shadow:0 2px 12px #102022}.title p{font-size:clamp(10px,1.2vw,15px);line-height:1.35;margin:0;color:#e2dfca;text-shadow:0 2px 8px #102022}
    .controls{position:absolute;right:2.8%;bottom:5%;display:flex;gap:9px;pointer-events:auto}.controls button,.card button{appearance:none;border:1px solid #b7a781;background:#172829d9;color:#fff0ce;border-radius:4px;padding:12px 15px;font-size:14px;font-weight:900;cursor:pointer;box-shadow:0 3px 0 #070b0c}.controls button:hover,.card button:hover{background:#34534b}.controls button:focus-visible,.card button:focus-visible{outline:3px solid #ffae57}
    .hint{position:absolute;right:2.8%;top:5%;font-size:10px;letter-spacing:.16em;text-align:right;color:#e1d6b9;text-shadow:0 2px 8px #102022}
    .card{position:absolute;right:3%;top:19%;width:min(275px,29vw);min-height:120px;background:linear-gradient(145deg,#f1dfb4,#c4a977);border:6px solid #4c3727;border-radius:4px;color:#25221b;box-shadow:0 14px 35px #050d0e8f, inset 0 0 0 1px #fff2d3;padding:15px 18px;pointer-events:auto;transform:rotate(1deg)}
    .card[hidden]{display:none}.card b{display:block;font-size:11px;letter-spacing:.22em;color:#8f4b26}.card strong{display:block;font-size:clamp(19px,1.7vw,25px);margin:7px 0 5px}.card span{display:block;font-size:12px;line-height:1.3}.card button{background:#a84029;border-color:#682a1d;margin-top:13px;font-size:11px;padding:9px 13px}
    #rotate{display:none;position:absolute;inset:0;z-index:10;place-items:center;text-align:center;background:#0e3438;padding:25px;font-size:24px;font-weight:900;letter-spacing:.02em}
    @media(orientation:portrait){#rotate{display:grid}}
    @media(max-width:900px){.brand{left:3%;top:5%}.hint{top:6%}.title{bottom:4%}.controls{bottom:3%}.controls button{padding:9px 11px}.card{top:auto;left:2%;right:2%;bottom:2%;width:96%;min-height:66px;padding:8px 12px;border-width:4px;transform:none;display:flex;align-items:center;gap:10px}.card b{font-size:9px;min-width:72px}.card strong{font-size:16px;min-width:130px}.card span{font-size:10px;flex:1}.card button{font-size:9px;padding:7px;margin:0}.hud.has-selection .title,.hud.has-selection .controls{display:none}}
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="hud">
    <div class="brand">ROCKHOP<small>THE ROUTE ATLAS</small></div>
    <div class="hint">DRAG TO ROTATE · SCROLL TO ZOOM<br>SELECT A FLAG TOWER</div>
    <div class="title"><div class="eyebrow">12 STAGES • 4 BIOMES</div><h1>THE WILDLANDS RUN</h1><p>A hand-built tabletop journey from the shipyard to the snowline.</p></div>
    <div class="card" id="card" hidden><b id="card-number">STAGE 01</b><strong id="card-title">THE DOCK RUN</strong><span id="card-detail">Coast • Tap a flag tower to preview a course.</span><button id="card-close">CLOSE</button></div>
    <div class="controls"><button id="left" aria-label="Rotate map left">↶</button><button id="reset">CENTER</button><button id="right" aria-label="Rotate map right">↷</button></div>
  </div>
  <div id="rotate">Rotate your phone to landscape</div>
  <script type="module" src="./main.js"></script>
</body>
</html>
