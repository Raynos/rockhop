# Pushes and pull requests run release gates. Hourly or manual runs ship the latest green main
# commit to https://playrockhop.vercel.app only when that SHA is not already live.
# Ported from project-wildshard-singleplayer (ask 84). Pins (v0.x aliases) stay manual: RELEASES.md.
#
# Secrets: VERCEL_BUILD_TOKEN (team-scoped CLI token), VERCEL_ORG_ID (team id), VERCEL_PROJECT_ID.
# Until VERCEL_BUILD_TOKEN exists the gates still run and scheduled deploys warn.
name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: # deploy HEAD on demand: gh workflow run deploy

concurrency:
  # Push checks (including the Android store job) must not queue an on-demand release.
  group: deploy-${{ github.ref }}-${{ github.event_name == 'push' && 'checks' || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  DEPLOY: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && secrets.VERCEL_BUILD_TOKEN != '' }}
  PROD_URL: https://playrockhop.vercel.app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # .git is ~8 GB and the tree ~1.5 GB, nearly all captures / masters / evidence the build and the
      # tests never read. Partial clone + sparse checkout keeps the runner to code + shipped assets;
      # .vercelignore drops the same dirs from the upload for local deploys.
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /*
            !/harness/out/
            !/assets/blender/
            !/assets/design/
            !/docs/evidence/
            !/project/releases/
          sparse-checkout-cone-mode: false

      - name: Skip if this commit is already live
        id: live
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          live=$(curl -fsS "$PROD_URL/version.json?t=$(date +%s)" || true)
          live_sha=$(printf '%s' "$live" | jq -r '.sha // empty' 2>/dev/null || true)
          if [ "$live_sha" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "Already live: $GITHUB_SHA"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Latest main $GITHUB_SHA is not live (current: ${live_sha:-unavailable})"
          fi

      - uses: pnpm/action-setup@v4 # version from package.json packageManager
        if: steps.live.outputs.current != 'true'

      - uses: actions/setup-node@v4
        if: steps.live.outputs.current != 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        if: steps.live.outputs.current != 'true'
        run: pnpm install --frozen-lockfile

      # ---- gates: a red step here means no deploy -----------------------------------------------
      - name: Typecheck (app + harness)
        if: steps.live.outputs.current != 'true'
        run: pnpm run typecheck

      - name: Lint
        if: steps.live.outputs.current != 'true'
        run: pnpm run lint

      # Everything except the wall-clock budgets (µs/tick, synth CPU per frame): a shared runner reads them
      # 2.5–4× over (probe run 35776724665), so they are measured on real hardware (pnpm harness:bench), not
      # here. `ffmpeg resolution` checks the local capture toolchain, which the runner does not have. The
      # runner is also slower, hence the longer per-test timeout.
      - name: Unit tests
        if: steps.live.outputs.current != 'true'
        run: pnpm exec vitest run --testTimeout=30000 -t '^(?!.*(s/tick|of CPU|ffmpeg resolution)).*$'

      # Pushes and PRs need a web gate; scheduled/manual deploys get it from `vercel build`.
      - name: Web build (push or PR)
        if: steps.live.outputs.current != 'true' && env.DEPLOY != 'true'
        run: pnpm run build

      # Store release bar 1 (docs/plans/STORE_RELEASE.md P0.4): the store bundle's denylist hits = 0, blocking
      # (--strict; the rules are scripts/ip-audit-rules.mjs). Rebuilds dist/ as the store build — the prebuilt
      # web output below is a separate Vercel artifact, so this dist/ is never shipped. The report
      # reaches the summary before the exit status does (no `| tee`: without pipefail it would swallow the failure).
      - name: IP audit (store build, strict)
        if: steps.live.outputs.current != 'true'
        run: |
          pnpm run build:store
          set +e
          node scripts/ip-audit.mjs --strict > ip-audit.txt
          status=$?
          set -e
          cat ip-audit.txt
          { echo '### IP audit (store build)'; echo '```'; head -40 ip-audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # ---- deploy (hourly or manual; latest main only) -----------------------------------------
      - name: No token, no deploy
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && env.DEPLOY != 'true'
        run: echo "::warning::VERCEL_BUILD_TOKEN secret is not set — gates passed but nothing was deployed"

      # A team-scoped token supports the account lookup used by pull/build/deploy. Build here,
      # then upload the artifact without a second Vercel-side Vite build.
      - name: Build Vercel output in GitHub Actions
        if: env.DEPLOY == 'true' && steps.live.outputs.current != 'true'
        env:
          VERCEL_BUILD_TOKEN: ${{ secrets.VERCEL_BUILD_TOKEN }}
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
        run: |
          npm install --global vercel@59.11.2
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json
          vercel pull --yes --environment production --scope raynos-projects --token "$VERCEL_BUILD_TOKEN"
          vercel build --prod --scope raynos-projects --token "$VERCEL_BUILD_TOKEN"
          test -f .vercel/output/config.json
          test -f .vercel/output/static/version.json
          test -f .vercel/output/functions/api/inbox.func/.vc-config.json
          test -f .vercel/output/functions/api/sentry.func/.vc-config.json
          python3 scripts/vercel-deref-func.py .vercel/output/functions/api/inbox.func

      - name: Deploy prebuilt output
        if: env.DEPLOY == 'true' && steps.live.outputs.current != 'true'
        env:
          VERCEL_BUILD_TOKEN: ${{ secrets.VERCEL_BUILD_TOKEN }}
        run: |
          url=$(vercel deploy --prebuilt --prod --yes --archive=tgz --scope raynos-projects --token "$VERCEL_BUILD_TOKEN")
          echo "deployed $url for ${{ github.sha }}"
          echo "### Deployed \`${{ github.sha }}\` to $url" >> "$GITHUB_STEP_SUMMARY"

      # The deploy command returns once the deployment is ready; prove production now serves this commit.
      - name: Production serves this commit
        if: env.DEPLOY == 'true' && steps.live.outputs.current != 'true'
        run: |
          for i in $(seq 1 30); do
            live=$(curl -fsS "$PROD_URL/version.json?t=$(date +%s)" || true)
            live_sha=$(printf '%s' "$live" | jq -r '.sha // empty' 2>/dev/null || true)
            if [ "$live_sha" = "$GITHUB_SHA" ]; then echo "live: $live"; exit 0; fi
            sleep 10
          done
          echo "::error::$PROD_URL/version.json does not report $GITHUB_SHA after 5 min: $live"
          exit 1

  # Store release (docs/plans/STORE_RELEASE.md Phase 5-6): the App Store / Google Play bundle and both native shells.
  # Its own job, in parallel: the web deploy above never waits for it, and a red store job never blocks a deploy.
  store:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /*
            !/harness/out/
            !/assets/blender/
            !/assets/design/
            !/docs/evidence/
            !/project/releases/
          sparse-checkout-cone-mode: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build from the same clean Git export used for signed local releases. This catches assets that
      # exist in the checkout but were omitted from the archive before either store shell is synced.
      - name: Store bundle + cap sync
        run: node scripts/store-build.mjs release

      - name: Store listing (lengths, denied terms)
        run: node scripts/store-metadata.mjs

      # Bar 1, blocking (--strict): the store bundle and the shells' copies of it hold no denylist hit.
      - name: IP audit (store bundle + shells, strict)
        run: |
          set +e
          node scripts/ip-audit.mjs --strict store/build/web ios android store/metadata > ip-audit.txt
          status=$?
          set -e
          cat ip-audit.txt
          { echo '### IP audit (store bundle + shells)'; echo '```'; head -30 ip-audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # A debug APK proves the Android project compiles against targetSdk 36 with the synced plugins. Unsigned: the
      # upload key never leaves the maintainer's machine (~/.config/rockhop).
      - name: Android debug build
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -q
